server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m
  trace_idle_period: 10s

compactor:
  compaction:
    block_retention: 168h   # 7 days — plenty for restaurant volume

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: quicc
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  processor:
    # deployment.environment rides along as a label on the generated
    # traces_spanmetrics_* / traces_service_graph_* series so Grafana's
    # env template variable can filter them (arrives in Prometheus as
    # deployment_environment).
    service_graphs:
      dimensions: [deployment.environment]
    span_metrics:
      dimensions: [deployment.environment]

overrides:
  defaults:
    metrics_generator:
      processors:
        - service-graphs
        - span-metrics
