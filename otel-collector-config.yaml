extensions:
  # Liveness for Docker's healthcheck and the off-box uptime check.
  health_check:
    endpoint: 0.0.0.0:13133

  # Bearer-token auth on the OTLP HTTP receiver. Apps must send
  # Authorization: Bearer <OTLP_BEARER_TOKEN> or their requests are rejected.
  # gRPC receiver is NOT protected — it's only reachable over the Docker
  # internal network / localhost, never via Traefik.
  bearertokenauth/otlp:
    scheme: Bearer
    token: ${env:OTLP_BEARER_TOKEN}

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: bearertokenauth/otlp

processors:
  memory_limiter:
    check_interval: 2s
    limit_percentage: 80
    spike_limit_percentage: 25

  batch:
    timeout: 5s
    send_batch_size: 1024

  resource:
    attributes:
      - key: collector.version
        value: "0.117.0"
        action: insert
      # The SDKs (semconv >= 1.27) send deployment.environment.name; every
      # dashboard, alert rule, Loki index label and Tempo dimension keys on
      # deployment.environment. Copy it here once instead of in every app.
      - key: deployment.environment
        from_attribute: deployment.environment.name
        action: insert

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    tls:
      insecure: true
    resource_to_telemetry_conversion:
      enabled: true
    send_metadata: true

  debug:
    verbosity: basic

service:
  extensions: [health_check, bearertokenauth/otlp]

  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp/tempo]

    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheusremotewrite]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/loki]

  telemetry:
    logs:
      level: info
    metrics:
      address: 0.0.0.0:8888
