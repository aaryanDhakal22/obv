apiVersion: 1

# When the store is closed: alerts labelled hours=opening (the counter
# terminal's "disconnected" rule) don't page then (policies.yaml). Grafana
# still evaluates them; one still firing when the store opens pages then
# (a terminal that didn't come back on for the day).
#
# Lombardi's (Towson MD) opening hours, confirmed by the owner 2026-11-12,
# in the store's time zone (America/New_York):
#   STORE_HOURS_MON_THU = 10:00 – 01:00 (the next day)
#   STORE_HOURS_FRI_SAT = 10:00 – 02:00 (the next day)
#   STORE_HOURS_SUN     = 10:30 – 24:00 (midnight)
# The store closes after midnight, so each day's closed window starts when
# the night before ends. The quiet windows below follow from these:
#   Mon        00:00 – 10:00   (Sunday closes at midnight)
#   Tue – Fri  01:00 – 10:00   (Mon – Thu close at 01:00)
#   Sat        02:00 – 10:00   (Friday closes at 02:00)
#   Sun        02:00 – 10:30   (Saturday closes at 02:00)
# main's Postgres backup runs at 04:30 (deploy/backup/quicc-backup.timer):
# inside every closed window. One store, so one timing; a second store with
# other hours gets its own timing plus a route on tenant=<slug>. Change the
# times here and restart Grafana (no app release).
muteTimes:
  - orgId: 1
    name: store-closed
    time_intervals:
      - weekdays: ["monday"]
        times:
          - start_time: "00:00"
            end_time: "10:00"
        location: America/New_York
      - weekdays: ["tuesday:friday"]
        times:
          - start_time: "01:00"
            end_time: "10:00"
        location: America/New_York
      - weekdays: ["saturday"]
        times:
          - start_time: "02:00"
            end_time: "10:00"
        location: America/New_York
      - weekdays: ["sunday"]
        times:
          - start_time: "02:00"
            end_time: "10:30"
        location: America/New_York
