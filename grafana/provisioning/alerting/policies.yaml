apiVersion: 1

# team=orders alerts are routed by environment: prod pages loudly (priority 1,
# bypasses quiet hours); staging, dev (and a series with no env label) go nowhere —
# the owner, 2026-11-13: staging never notifies anyone. Grouped per env + store +
# module, so a burst of one module's failures is one notification, not twenty.
policies:
  - orgId: 1
    receiver: default-noop
    group_by: ["grafana_folder", "alertname"]
    routes:
      # Rules labelled hours=opening (the counter terminal's "disconnected"
      # rule) page only while the store is open: store-closed lives in
      # store-hours.yaml. Must stay above the plain prod route (first match wins).
      - receiver: pushover-orders
        object_matchers:
          - ["team", "=", "orders"]
          - ["deployment_environment", "=", "prod"]
          - ["hours", "=", "opening"]
        mute_time_intervals: ["store-closed"]
        group_by: ["deployment_environment", "tenant", "module", "alertname"]
        group_wait: 30s
        group_interval: 2m
        repeat_interval: 1h
      - receiver: pushover-orders
        object_matchers:
          - ["team", "=", "orders"]
          - ["deployment_environment", "=", "prod"]
        group_by: ["deployment_environment", "tenant", "module", "alertname"]
        group_wait: 30s
        group_interval: 2m
        repeat_interval: 1h
