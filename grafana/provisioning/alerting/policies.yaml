apiVersion: 1

# Route everything tagged team=orders to Pushover; everything else to the
# no-op default. Grouping by module+env so a burst of one module's failures is
# one notification, not twenty.
policies:
  - orgId: 1
    receiver: default-noop
    group_by: ["grafana_folder", "alertname"]
    routes:
      - receiver: pushover-orders
        object_matchers:
          - ["team", "=", "orders"]
        group_by: ["module", "deployment_environment", "alertname"]
        group_wait: 30s
        group_interval: 2m
        repeat_interval: 1h
