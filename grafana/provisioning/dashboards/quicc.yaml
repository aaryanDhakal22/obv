apiVersion: 1

# Two folders, one sub-directory each. Dashboards are file-provisioned; the JSON
# files are the source of truth. Keep the paths disjoint: a file provider walks
# its path recursively, so a provider on the dashboards root would load debug/
# twice (duplicate UIDs block both providers' writes).
#   Quicc        - the store-scoped infra dashboards (Store health, Latency & bottlenecks,
#                  Uptime & incidents, Fleet & upgrades)
#   Quicc Debug  - the module/stack drill-downs (stack health, logs, online relay, duplex RPC, admin)
providers:
  - name: quicc
    orgId: 1
    folder: Quicc
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/quicc
      foldersFromFilesStructure: false

  - name: quicc-debug
    orgId: 1
    folder: Quicc Debug
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/debug
      foldersFromFilesStructure: false
