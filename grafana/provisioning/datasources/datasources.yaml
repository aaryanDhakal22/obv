apiVersion: 1

datasources:
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      httpMethod: GET
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        tags:
          - key: service.name
            value: service_name
          - key: deployment.environment
            value: deployment_environment
        filterByTraceID: true
        filterBySpanID: false
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        # Tempo's metrics-generator labels series with `service` (intrinsic),
        # not `service_name` — these tags must match the generated metrics.
        tags:
          - key: service.name
            value: service
          - key: deployment.environment
            value: deployment_environment
        queries:
          - name: Request rate
            query: 'sum(rate(traces_spanmetrics_calls_total{$$__tags}[5m]))'
          - name: p95 duration
            query: 'histogram_quantile(0.95, sum(rate(traces_spanmetrics_latency_bucket{$$__tags}[5m])) by (le))'

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - name: TraceID
          matcherType: label
          matcherRegex: trace_id
          url: '$${__value.raw}'
          datasourceUid: tempo
          urlDisplayLabel: View trace

  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      httpMethod: POST
      manageAlerts: false
      prometheusType: Prometheus
      prometheusVersion: 3.0.1
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  # main's Postgres, read through the `reporting` views only (no PII). Role
  # grafana_ro has USAGE on schema reporting + SELECT on its views and nothing
  # on public (observability/postgres/grafana-ro.sql; TENANT-SCOPING.md §2).
  # Connection values come from the `obv` Doppler config via docker-compose;
  # left empty, the datasource still provisions and its panels just error.
  # The store dashboards pick one through the `pg` variable (/^pg-${env}$/).
  - name: pg-prod
    type: grafana-postgresql-datasource
    uid: pg-prod
    access: proxy
    url: ${GRAFANA_PG_PROD_URL}            # host:port
    user: grafana_ro
    jsonData:
      database: ${GRAFANA_PG_PROD_DB}
      sslmode: disable
      postgresVersion: 1500
      timescaledb: false
      timeInterval: 1m
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
    secureJsonData:
      password: ${GRAFANA_PG_PROD_PASSWORD}
    editable: false

  - name: pg-staging
    type: grafana-postgresql-datasource
    uid: pg-staging
    access: proxy
    url: ${GRAFANA_PG_STAGING_URL}         # host:port
    user: grafana_ro
    jsonData:
      database: ${GRAFANA_PG_STAGING_DB}
      sslmode: disable
      postgresVersion: 1500
      timescaledb: false
      timeInterval: 1m
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
    secureJsonData:
      password: ${GRAFANA_PG_STAGING_PASSWORD}
    editable: false
