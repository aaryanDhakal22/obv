apiVersion: 1

# The Postgres reporting datasources (pg-prod / pg-staging) are gone: every
# number reaches Grafana over OTLP (TENANT-SCOPING.md). Listed here so a Grafana
# that provisioned them earlier drops them too.
deleteDatasources:
  - name: pg-prod
    orgId: 1
  - name: pg-staging
    orgId: 1

datasources:
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      httpMethod: GET
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        tags:
          - key: service.name
            value: service_name
          - key: deployment.environment
            value: deployment_environment
        filterByTraceID: true
        filterBySpanID: false
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        # Tempo's metrics-generator labels series with `service` (intrinsic),
        # not `service_name` — these tags must match the generated metrics.
        tags:
          - key: service.name
            value: service
          - key: deployment.environment
            value: deployment_environment
        queries:
          - name: Request rate
            query: 'sum(rate(traces_spanmetrics_calls_total{$$__tags}[5m]))'
          - name: p95 duration
            query: 'histogram_quantile(0.95, sum(rate(traces_spanmetrics_latency_bucket{$$__tags}[5m])) by (le))'

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - name: TraceID
          matcherType: label
          matcherRegex: trace_id
          url: '$${__value.raw}'
          datasourceUid: tempo
          urlDisplayLabel: View trace

  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      httpMethod: POST
      manageAlerts: false
      prometheusType: Prometheus
      prometheusVersion: 3.0.1
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
