      - record: eff:terminal_ui_order_duration_sum:increase1h
        expr: sum by (deployment_environment, tenant, staff, version, outcome, type) (increase(terminal_ui_order_duration_milliseconds_sum[1h])) and on (deployment_environment, tenant, staff, version, outcome, type) (sum by (deployment_environment, tenant, staff, version, outcome, type) (increase(terminal_ui_order_duration_milliseconds_count[1h])) > 0)
      - record: eff:terminal_ui_order_duration_bucket:increase1h
        expr: sum by (le, deployment_environment, tenant, staff, version, outcome, type) (increase(terminal_ui_order_duration_milliseconds_bucket[1h])) and on (deployment_environment, tenant, staff, version, outcome, type) (sum by (deployment_environment, tenant, staff, version, outcome, type) (increase(terminal_ui_order_duration_milliseconds_count[1h])) > 0)
      - record: eff:terminal_ui_step_duration_count:increase1h
        expr: sum by (deployment_environment, tenant, staff, version, step, type) (increase(terminal_ui_step_duration_milliseconds_count[1h])) > 0
      - record: eff:terminal_ui_step_duration_sum:increase1h
        expr: sum by (deployment_environment, tenant, staff, version, step, type) (increase(terminal_ui_step_duration_milliseconds_sum[1h])) and on (deployment_environment, tenant, staff, version, step, type) (sum by (deployment_environment, tenant, staff, version, step, type) (increase(terminal_ui_step_duration_milliseconds_count[1h])) > 0)
      - record: eff:terminal_ui_step_duration_bucket:increase1h
        expr: sum by (le, deployment_environment, tenant, staff, version, step, type) (increase(terminal_ui_step_duration_milliseconds_bucket[1h])) and on (deployment_environment, tenant, staff, version, step, type) (sum by (deployment_environment, tenant, staff, version, step, type) (increase(terminal_ui_step_duration_milliseconds_count[1h])) > 0)
      - record: eff:terminal_ui_search_duration_count:increase1h
        expr: sum by (deployment_environment, tenant, staff, version, outcome, kind) (increase(terminal_ui_search_duration_milliseconds_count[1h])) > 0
      - record: eff:terminal_ui_search_duration_sum:increase1h
        expr: sum by (deployment_environment, tenant, staff, version, outcome, kind) (increase(terminal_ui_search_duration_milliseconds_sum[1h])) and on (deployment_environment, tenant, staff, version, outcome, kind) (sum by (deployment_environment, tenant, staff, version, outcome, kind) (increase(terminal_ui_search_duration_milliseconds_count[1h])) > 0)
      - record: eff:terminal_ui_search_duration_bucket:increase1h
        expr: sum by (le, deployment_environment, tenant, staff, version, outcome, kind) (increase(terminal_ui_search_duration_milliseconds_bucket[1h])) and on (deployment_environment, tenant, staff, version, outcome, kind) (sum by (deployment_environment, tenant, staff, version, outcome, kind) (increase(terminal_ui_search_duration_milliseconds_count[1h])) > 0)
      - record: eff:terminal_ui_item_duration_count:increase1h
        expr: sum by (deployment_environment, tenant, staff, version, via) (increase(terminal_ui_item_duration_milliseconds_count[1h])) > 0
      - record: eff:terminal_ui_item_duration_sum:increase1h
        expr: sum by (deployment_environment, tenant, staff, version, via) (increase(terminal_ui_item_duration_milliseconds_sum[1h])) and on (deployment_environment, tenant, staff, version, via) (sum by (deployment_environment, tenant, staff, version, via) (increase(terminal_ui_item_duration_milliseconds_count[1h])) > 0)
      - record: eff:terminal_ui_item_duration_bucket:increase1h
        expr: sum by (le, deployment_environment, tenant, staff, version, via) (increase(terminal_ui_item_duration_milliseconds_bucket[1h])) and on (deployment_environment, tenant, staff, version, via) (sum by (deployment_environment, tenant, staff, version, via) (increase(terminal_ui_item_duration_milliseconds_count[1h])) > 0)
