      - record: eff:callcenter_ui_search_duration_bucket:increase1h
        expr: sum by (le, deployment_environment, store, staff, version, outcome, kind) (((max_over_time(callcenter_ui_search_duration_milliseconds_bucket[1h]) unless callcenter_ui_search_duration_milliseconds_bucket offset 1h) or increase(callcenter_ui_search_duration_milliseconds_bucket[1h]))) and on (deployment_environment, store, staff, version, outcome, kind) (sum by (deployment_environment, store, staff, version, outcome, kind) (((max_over_time(callcenter_ui_search_duration_milliseconds_count[1h]) unless callcenter_ui_search_duration_milliseconds_count offset 1h) or increase(callcenter_ui_search_duration_milliseconds_count[1h]))) > 0)
      - record: eff:callcenter_ui_item_duration_count:increase1h
        expr: sum by (deployment_environment, store, staff, version, via) (((max_over_time(callcenter_ui_item_duration_milliseconds_count[1h]) unless callcenter_ui_item_duration_milliseconds_count offset 1h) or increase(callcenter_ui_item_duration_milliseconds_count[1h]))) > 0
      - record: eff:callcenter_ui_item_duration_sum:increase1h
        expr: sum by (deployment_environment, store, staff, version, via) (((max_over_time(callcenter_ui_item_duration_milliseconds_sum[1h]) unless callcenter_ui_item_duration_milliseconds_sum offset 1h) or increase(callcenter_ui_item_duration_milliseconds_sum[1h]))) and on (deployment_environment, store, staff, version, via) (sum by (deployment_environment, store, staff, version, via) (((max_over_time(callcenter_ui_item_duration_milliseconds_count[1h]) unless callcenter_ui_item_duration_milliseconds_count offset 1h) or increase(callcenter_ui_item_duration_milliseconds_count[1h]))) > 0)
      - record: eff:callcenter_ui_item_duration_bucket:increase1h
        expr: sum by (le, deployment_environment, store, staff, version, via) (((max_over_time(callcenter_ui_item_duration_milliseconds_bucket[1h]) unless callcenter_ui_item_duration_milliseconds_bucket offset 1h) or increase(callcenter_ui_item_duration_milliseconds_bucket[1h]))) and on (deployment_environment, store, staff, version, via) (sum by (deployment_environment, store, staff, version, via) (((max_over_time(callcenter_ui_item_duration_milliseconds_count[1h]) unless callcenter_ui_item_duration_milliseconds_count offset 1h) or increase(callcenter_ui_item_duration_milliseconds_count[1h]))) > 0)
