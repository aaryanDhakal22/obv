auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

limits_config:
  # Logs older than 30 days are deleted by the compactor (below); without it
  # Loki keeps everything until the home server's disk is full.
  retention_period: 720h
  # The UI telemetry (scope quicc.ui: the call center's agents and Centurion's cashiers, agent N 2026-11-17, the
  # owner: "save all detailed logs for the day and ... condense it ... and save it for a week"). The apps write two
  # streams, told apart by the `detail` resource attribute (an index label below): every event in detail="full",
  # kept a day (24h is Loki's shortest retention); the condensed digest (cards, checks, orders, errors, bad
  # clock / network samples, an hourly roll-up per agent) in detail="digest", kept 7 days. Everything without the
  # label keeps retention_period. Sizing: README "Retention".
  retention_stream:
    - selector: '{detail="full"}'
      priority: 1
      period: 24h
    - selector: '{detail="digest"}'
      priority: 1
      period: 168h
  # Above Loki's defaults (4 / 6 MB): one 30-second batch of the call center's UI events can reach ~6 MB.
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  allow_structured_metadata: true
  volume_enabled: true
  otlp_config:
    resource_attributes:
      attributes_config:
        - action: index_label
          attributes:
            - service.name
            - deployment.environment
            - service.instance.id
            - tenant
            - location
            # full | digest on the UI telemetry streams (retention_stream above); absent elsewhere.
            - detail
    log_attributes:
      - action: structured_metadata
        attributes:
          - trace_id
          - span_id
          - level

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

ruler:
  alertmanager_url: http://localhost:9093

analytics:
  reporting_enabled: false
